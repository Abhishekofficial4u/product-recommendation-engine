services:

  # ── FastAPI backend ──────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rec_engine_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
      - ./backend/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── React frontend via nginx ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: rec_engine_frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

# ── Usage ──────────────────────────────────────────────────────────────────
# Start everything:
#   docker-compose up --build
#
# Then open:
#   http://localhost:3000   ← React UI
#   http://localhost:8000/docs  ← API Swagger docs
#
# Stop:
#   docker-compose down
